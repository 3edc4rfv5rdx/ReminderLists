org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
org.gradle.configuration-cache=true
# Task outputs are reused across builds and branches, so a clean or a branch switch
# only recomputes what actually changed.
org.gradle.caching=true
# Build with the JDKs already installed: Gradle pulled a JetBrains 21 of its own once,
# and a second JVM means a second daemon with a cold JIT.
org.gradle.java.installations.auto-download=false
